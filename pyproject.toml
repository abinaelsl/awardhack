[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awardhack"
version = "0.1.0"
description = "Award-redemption optimiser: same seat, price it in every program, rank by value"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
awardhack = "awardhack.cli:main"

[tool.setuptools]
packages = ["awardhack"]
